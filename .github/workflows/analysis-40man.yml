name: Temporary MLB-wide 40-man analysis

on:
  push:
    branches:
      - agent/enrichment-formatting-v1

permissions:
  contents: read

jobs:
  analyze:
    if: github.event.head_commit.message == 'Final reconciled MLB-wide 40-man analysis'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Calculate reconciled daily historical 40-man occupancy
        run: |
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from collections import defaultdict
          from datetime import date, timedelta
          from statistics import median, mean
          import requests, time

          BASE='https://statsapi.mlb.com/api/v1'
          START=date(2026,3,25)
          END=date(2026,8,16)
          GIANTS=137

          def get_json(url, tries=5):
              last=None
              for i in range(tries):
                  try:
                      r=requests.get(url, timeout=25)
                      if r.status_code==200:
                          return r.json()
                      last=RuntimeError(f'{r.status_code}: {r.text[:160]}')
                  except Exception as e:
                      last=e
                  time.sleep(0.35*(i+1))
              raise last

          teams=(get_json(f'{BASE}/teams?sportId=1&season=2026').get('teams') or [])
          teams=[t for t in teams if t.get('active',True)]
          team_map={t['id']:t['name'] for t in teams}
          assert len(team_map)==30

          days=[]; d=START
          while d<=END:
              days.append(d); d+=timedelta(days=1)

          def fetch_roster(pair):
              tid,d=pair
              roster=(get_json(f'{BASE}/teams/{tid}/roster/40Man?date={d.isoformat()}').get('roster') or [])
              ids=set()
              for x in roster:
                  pid=(x.get('person') or {}).get('id')
                  code=(x.get('status') or {}).get('code') or ''
                  if pid and code!='D60': ids.add(pid)
              return tid,d,len(ids)

          raw={tid:{} for tid in team_map}
          pairs=[(tid,d) for tid in team_map for d in days]
          with ThreadPoolExecutor(max_workers=32) as ex:
              futs=[ex.submit(fetch_roster,p) for p in pairs]
              for n,f in enumerate(as_completed(futs),1):
                  tid,d,c=f.result(); raw[tid][d]=c
                  if n%1000==0: print('ROSTERS',n,'OF',len(pairs))

          # MLB occasionally exposes transient >40 historical states. For an
          # open-spot question those are safely treated as full, never open.
          capped={tid:{d:min(40,raw[tid][d]) for d in days} for tid in team_map}
          over40=[(team_map[tid],d,raw[tid][d]) for tid in team_map for d in days if raw[tid][d]>40]

          # Pull each club's transactions once and index them by date.
          tx_by_team={tid:defaultdict(list) for tid in team_map}
          def fetch_txs(tid):
              url=f'{BASE}/transactions?teamId={tid}&startDate={START.isoformat()}&endDate={END.isoformat()}'
              return tid,(get_json(url).get('transactions') or [])
          with ThreadPoolExecutor(max_workers=12) as ex:
              for f in as_completed([ex.submit(fetch_txs,tid) for tid in team_map]):
                  tid,txs=f.result()
                  for t in txs:
                      ds=str(t.get('date') or '')[:10]
                      if ds:
                          try: dd=date.fromisoformat(ds)
                          except ValueError: continue
                          tx_by_team[tid][dd].append(t)

          def d60_create(t):
              s=(t.get('description') or '').lower()
              return ('60-day injured list' in s and
                      (('placed' in s and ' on the 60-day injured list' in s) or
                       ('transferred' in s and ' to the 60-day injured list' in s)))

          def forty_add(t,tid):
              code=(t.get('typeCode') or '').upper()
              s=(t.get('description') or '').lower()
              if code in {'SE','CLW'}: return True
              if 'activated' in s and 'from the 60-day injured list' in s: return True
              if code=='SFA' and 'minor league contract' not in s: return True
              if code=='TR':
                  to=(t.get('toTeam') or {}).get('id')
                  return to==tid
              return False

          reconciled={tid:dict(capped[tid]) for tid in team_map}
          corrections=[]
          # Conservative normalization: only isolated dips with full adjacent
          # days plus an explicit same-day D60-created spot and 40-man add.
          for tid in team_map:
              for i in range(1,len(days)-1):
                  d=days[i]
                  if capped[tid][d] >= 40: continue
                  if capped[tid][days[i-1]] < 40 or capped[tid][days[i+1]] < 40: continue
                  txs=tx_by_team[tid].get(d,[])
                  if any(d60_create(t) for t in txs) and any(forty_add(t,tid) for t in txs):
                      corrections.append((team_map[tid],d,capped[tid][d],40))
                      reconciled[tid][d]=40

          def calc_streaks(tid):
              vals=[reconciled[tid][d]<40 for d in days]
              longest=cur=0
              for v in vals:
                  if v: cur+=1; longest=max(longest,cur)
                  else: cur=0
              current=0
              for v in reversed(vals):
                  if v: current+=1
                  else: break
              return longest,current

          rows=[]
          for tid,name in team_map.items():
              rc=[reconciled[tid][d] for d in days]
              rawc=[capped[tid][d] for d in days]
              longest,current=calc_streaks(tid)
              rows.append({
                'id':tid,'team':name,
                'open':sum(c<40 for c in rc),
                'raw_open':sum(c<40 for c in rawc),
                'longest':longest,'current':current,
                'today':rc[-1], 'min':min(rc),
                'd39':sum(c==39 for c in rc),'d38':sum(c==38 for c in rc),
                'd37':sum(c<=37 for c in rc),
              })
          rows.sort(key=lambda r:(-r['open'],r['team']))
          sf=next(r for r in rows if r['id']==GIANTS)
          rank=1+sum(r['open']>sf['open'] for r in rows)
          tied=sum(r['open']==sf['open'] for r in rows)
          total=sum(r['open'] for r in rows)

          print('\n=== SUMMARY ===')
          print('WINDOW',START,END,'DAYS',len(days))
          print('OVER40_SNAPSHOTS',len(over40),over40)
          print('ISOLATED_D60_ADD_CORRECTIONS',len(corrections),corrections)
          print('MLB_OPEN_TEAM_DAYS',total,'OF',len(days)*30,'PCT',round(100*total/(len(days)*30),1))
          print('TEAM_MEAN_OPEN_DAYS',round(mean(r['open'] for r in rows),1))
          print('TEAM_MEDIAN_OPEN_DAYS',median(r['open'] for r in rows))
          print('TEAMS_OPEN_AUG16',sum(r['today']<40 for r in rows))
          print('GIANTS',sf,'RANK_MOST_OPEN_DAYS',rank,'TIED',tied)

          print('\n=== ALL TEAMS ===')
          for i,r in enumerate(rows,1):
              print(f"{i:2d}. {r['team']}: open={r['open']} (raw={r['raw_open']}), longest={r['longest']}, current={r['current']}, Aug16={r['today']}/40, 39d={r['d39']}, 38d={r['d38']}, <=37d={r['d37']}")

          print('\n=== GIANTS STREAKS ===')
          active=False; start=None
          for d in days:
              o=reconciled[GIANTS][d]<40
              if o and not active: start=d; active=True
              if active and not o:
                  e=d-timedelta(days=1)
                  vals=[reconciled[GIANTS][x] for x in days if start<=x<=e]
                  print(start,e,(e-start).days+1,'counts',min(vals),max(vals))
                  active=False
          if active:
              vals=[reconciled[GIANTS][x] for x in days if start<=x<=END]
              print(start,END,(END-start).days+1,'counts',min(vals),max(vals))

          print('\n=== GIANTS AUG 1-16 ===')
          for d in days:
              if d>=date(2026,8,1):
                  print(d,'raw',raw[GIANTS][d],'cap',capped[GIANTS][d],'recon',reconciled[GIANTS][d])
          PY
