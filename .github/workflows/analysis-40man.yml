name: Temporary MLB-wide 40-man analysis

on:
  push:
    branches:
      - agent/enrichment-formatting-v1

permissions:
  contents: read

jobs:
  analyze:
    if: github.event.head_commit.message == 'Inspect 40-man status semantics'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Inspect roster status semantics
        run: |
          python - <<'PY'
          import requests
          from collections import Counter
          BASE='https://statsapi.mlb.com/api/v1'
          cases=[(137,'2026-08-16','Giants'),(133,'2026-04-07','Athletics')]
          for tid,d,label in cases:
              js=requests.get(f'{BASE}/teams/{tid}/roster/40Man?date={d}',timeout=30).json()
              roster=js.get('roster') or []
              print('\nCASE',label,d,'RAW',len(roster))
              c=Counter()
              for x in roster:
                  st=x.get('status') or {}
                  code=st.get('code')
                  desc=st.get('description')
                  c[(code,desc)] += 1
              print('STATUS_COUNTS',dict(c))
              for x in roster:
                  st=x.get('status') or {}
                  print(x.get('person',{}).get('fullName'), st.get('code'), st.get('description'))
          PY
