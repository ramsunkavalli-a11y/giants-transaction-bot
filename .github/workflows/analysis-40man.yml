name: Temporary MLB-wide 40-man analysis

on:
  push:
    branches:
      - agent/enrichment-formatting-v1

permissions:
  contents: read

jobs:
  analyze:
    if: github.event.head_commit.message == 'Temporary MLB-wide 40-man analysis'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Calculate daily historical 40-man occupancy
        run: |
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import date, timedelta
          from statistics import median, mean
          import requests, time

          BASE='https://statsapi.mlb.com/api/v1'
          START=date(2026,3,25)
          END=date(2026,8,16)
          GIANTS=137

          def get_json(url, tries=5):
              last=None
              for i in range(tries):
                  try:
                      r=requests.get(url, timeout=20)
                      if r.status_code==200:
                          return r.json()
                      last=RuntimeError(f'{r.status_code}: {r.text[:200]}')
                  except Exception as e:
                      last=e
                  time.sleep(0.5*(i+1))
              raise last

          teams=(get_json(f'{BASE}/teams?sportId=1&season=2026').get('teams') or [])
          teams=[t for t in teams if t.get('active',True)]
          team_map={t['id']:t['name'] for t in teams}
          print('TEAMS',len(team_map))
          assert len(team_map)==30, team_map

          days=[]
          d=START
          while d<=END:
              days.append(d)
              d += timedelta(days=1)
          print('DATES',len(days),START,END)

          # Validate historical endpoint changes membership over time for SF.
          sf_start=get_json(f'{BASE}/teams/{GIANTS}/roster/40Man?date={START.isoformat()}').get('roster') or []
          sf_end=get_json(f'{BASE}/teams/{GIANTS}/roster/40Man?date={END.isoformat()}').get('roster') or []
          start_ids={x.get('person',{}).get('id') for x in sf_start}
          end_ids={x.get('person',{}).get('id') for x in sf_end}
          print('SF_ENDPOINT_VALIDATION',len(sf_start),len(sf_end),'membership_delta',len(start_ids^end_ids))
          assert start_ids != end_ids

          def fetch_one(pair):
              tid,d=pair
              js=get_json(f'{BASE}/teams/{tid}/roster/40Man?date={d.isoformat()}')
              roster=js.get('roster') or []
              ids={x.get('person',{}).get('id') for x in roster if x.get('person',{}).get('id')}
              return tid,d,len(ids)

          pairs=[(tid,d) for d in days for tid in team_map]
          results={tid:{} for tid in team_map}
          with ThreadPoolExecutor(max_workers=24) as ex:
              futs=[ex.submit(fetch_one,p) for p in pairs]
              for n,f in enumerate(as_completed(futs),1):
                  tid,d,c=f.result()
                  results[tid][d]=c
                  if n%500==0:
                      print('DONE',n,'OF',len(pairs))

          for tid in team_map:
              assert len(results[tid])==len(days)
              bad=[(d,c) for d,c in results[tid].items() if c<20 or c>40]
              assert not bad,(team_map[tid],bad[:5])

          def streaks(tid):
              vals=[results[tid][d] < 40 for d in days]
              longest=cur=0
              for v in vals:
                  if v:
                      cur+=1; longest=max(longest,cur)
                  else:
                      cur=0
              current=0
              for v in reversed(vals):
                  if v: current+=1
                  else: break
              return longest,current

          rows=[]
          for tid,name in team_map.items():
              counts=[results[tid][d] for d in days]
              open_days=sum(c<40 for c in counts)
              longest,current=streaks(tid)
              rows.append({
                  'id':tid,'team':name,'open_days':open_days,
                  'longest':longest,'current':current,'min':min(counts),
                  'days39':sum(c==39 for c in counts),
                  'days38':sum(c==38 for c in counts),
                  'days37orless':sum(c<=37 for c in counts),
                  'today':counts[-1],
              })

          rows.sort(key=lambda r:(-r['open_days'],r['team']))
          sf=next(r for r in rows if r['id']==GIANTS)
          rank=1+sum(r['open_days']>sf['open_days'] for r in rows)
          tied=sum(r['open_days']==sf['open_days'] for r in rows)
          total_open=sum(r['open_days'] for r in rows)
          total_team_days=len(days)*len(rows)

          print('\n=== LEAGUE SUMMARY ===')
          print('WINDOW',START,END,'DAYS',len(days))
          print('MLB_OPEN_TEAM_DAYS',total_open,'OF',total_team_days,'PCT',round(100*total_open/total_team_days,1))
          print('TEAM_OPEN_DAYS_MEAN',round(mean(r['open_days'] for r in rows),1))
          print('TEAM_OPEN_DAYS_MEDIAN',median(r['open_days'] for r in rows))
          print('TEAMS_OPEN_TODAY',sum(r['today']<40 for r in rows),'OF',len(rows))
          print('SF',sf,'RANK_MOST_OPEN_DAYS',rank,'TIED_TEAMS',tied)

          print('\n=== ALL TEAMS (most open days first) ===')
          for i,r in enumerate(rows,1):
              print(f"{i:2d}. {r['team']}: open_days={r['open_days']}, longest={r['longest']}, current={r['current']}, today={r['today']}/40, min={r['min']}, 39={r['days39']}, 38={r['days38']}, <=37={r['days37orless']}")

          print('\n=== SF OPEN-SPOT STREAKS ===')
          in_streak=False; s=None; prev=None
          for d in days:
              o=results[GIANTS][d]<40
              if o and not in_streak:
                  s=d; in_streak=True
              if in_streak and not o:
                  e=d-timedelta(days=1)
                  print(s,e,(e-s).days+1)
                  in_streak=False
              prev=d
          if in_streak:
              print(s,END,(END-s).days+1)
          PY
