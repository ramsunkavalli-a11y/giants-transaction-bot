name: Temporary MLB-wide 40-man analysis

on:
  push:
    branches:
      - agent/enrichment-formatting-v1

permissions:
  contents: read

jobs:
  analyze:
    if: github.event.head_commit.message == 'Compare current and dated Giants 40-man'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Compare current vs dated roster
        run: |
          python - <<'PY'
          import requests
          BASE='https://statsapi.mlb.com/api/v1/teams/137/roster/40Man'
          def pull(url):
              r=requests.get(url,timeout=30); r.raise_for_status(); return r.json().get('roster') or []
          def counted(roster):
              out={}
              for x in roster:
                  p=x.get('person') or {}; s=x.get('status') or {}
                  if s.get('code')!='D60': out[p.get('id')]=(p.get('fullName'),s.get('code'),s.get('description'))
              return out
          current=pull(BASE)
          dated=pull(BASE+'?date=2026-08-16')
          c=counted(current); d=counted(dated)
          print('CURRENT_RAW',len(current),'CURRENT_COUNTED',len(c))
          print('DATED_RAW',len(dated),'DATED_COUNTED',len(d))
          print('CURRENT_NOT_DATED',[c[k] for k in sorted(set(c)-set(d))])
          print('DATED_NOT_CURRENT',[d[k] for k in sorted(set(d)-set(c))])
          print('CURRENT_D60',[(x.get('person',{}).get('fullName'),(x.get('status') or {}).get('description')) for x in current if (x.get('status') or {}).get('code')=='D60'])
          PY
