name: Seed seen_ids.txt (start posting from today LA)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate seen_ids.txt + last_id.txt
        run: |
          set -euo pipefail
          export TODAY_LA="$(TZ=America/Los_Angeles date +%F)"
          echo "TODAY_LA=$TODAY_LA"

          python3 - <<'PY'
          import os, json, urllib.request

          URL = "https://statsapi.mlb.com/api/v1/transactions?teamId=137&startDate=2026-01-01&endDate=2026-12-31"
          today = os.environ["TODAY_LA"]

          def txn_id(t):
              try:
                  return int(t.get("id", 0))
              except Exception:
                  return 0

          def txn_date(t):
              d = t.get("effectiveDate") or t.get("transactionDate") or t.get("date") or ""
              return str(d)[:10]

          with urllib.request.urlopen(URL) as r:
              data = json.load(r)

          txns = data.get("transactions") or []

          # Mark everything BEFORE today as already seen
          seen = sorted({txn_id(t) for t in txns if txn_id(t) > 0 and txn_date(t) < today})

          with open("seen_ids.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(map(str, seen)) + ("\n" if seen else ""))

          last_id = seen[-1] if seen else 0
          with open("last_id.txt", "w", encoding="utf-8") as f:
              f.write(str(last_id))

          # Helpful output
          todays_plus = [t for t in txns if txn_id(t) > 0 and txn_date(t) >= today]
          print("Total txns:", len(txns))
          print("Seen (< today):", len(seen))
          print("Would be NEW (>= today):", len(todays_plus))
          print("last_id:", last_id)
          PY

      - name: Commit files to repo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen_ids.txt last_id.txt

          # If nothing changed, don't error
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Seed transaction checkpoints starting from today (LA)"
          git push
