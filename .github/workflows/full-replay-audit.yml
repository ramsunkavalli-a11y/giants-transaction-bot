name: Full 2026 transaction replay audit

on:
  push:
    branches:
      - agent/enrichment-formatting-v1

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Replay full bot window without Bluesky
        run: |
          python - <<'PY'
          from collections import Counter
          from datetime import datetime
          import bot_core as infra
          import mlb_domain as domain
          import post_builder

          data = infra.request_json_with_retry(
              "https://statsapi.mlb.com/api/v1/transactions"
              "?teamId=137&startDate=2026-02-21&endDate=2026-08-16"
          )
          txns = data.get("transactions") or []
          print("RAW TRANSACTIONS", len(txns))
          print("RAW CODES", dict(sorted(Counter((tx.get('typeCode') or '').upper() for tx in txns).items())))

          posts = post_builder.build_posts(
              txns,
              player_cache={},
              season_mode=True,
              now_la=datetime(2026, 8, 16, 11, 0, 0),
          )
          print("POSTS", len(posts))
          assert posts
          assert all(len(post) <= infra.MAX_POST_LEN for post in posts), max(map(len, posts))

          unmapped = []
          covered_ids = set()
          for i, post in enumerate(posts):
              ids = infra.transaction_ids_represented_in_post(post, txns)
              if not ids:
                  unmapped.append((i, post))
              covered_ids.update(ids)
          if unmapped:
              print("UNMAPPED POSTS")
              for item in unmapped:
                  print(item)
          assert not unmapped, len(unmapped)

          expected_suppressed = set()
          for tx in txns:
              if domain.is_number_change_transaction(tx) or domain.is_generic_org_assignment_transaction(tx):
                  expected_suppressed.add(infra.txn_id(tx))

          # Exact duplicate rehab records intentionally collapse together, but
          # because the rendered description/date matches all duplicate IDs,
          # they should all still count as covered by state mapping.
          relevant_ids = {infra.txn_id(tx) for tx in txns if infra.txn_id(tx) > 0} - expected_suppressed
          missing = relevant_ids - covered_ids
          if missing:
              print("MISSING RELEVANT IDS", sorted(missing))
              for tx in txns:
                  if infra.txn_id(tx) in missing:
                      print(infra.txn_id(tx), tx.get('typeCode'), infra.txn_date(tx), infra.txn_desc(tx))
          assert not missing, len(missing)

          # One rendered trade line per unique real trade ID.
          trade_ids = {infra.txn_id(tx) for tx in txns if domain.is_trade_transaction(tx)}
          trade_lines = sum(post.count("- Trade:") for post in posts)
          assert trade_lines == len(trade_ids), (trade_lines, len(trade_ids))

          print("COVERED IDS", len(covered_ids))
          print("INTENTIONALLY SUPPRESSED IDS", len(expected_suppressed))
          print("UNIQUE TRADES", len(trade_ids))
          print("MAX POST LENGTH", max(map(len, posts)))
          print("FULL 2026 REPLAY AUDIT PASSED")
          PY
