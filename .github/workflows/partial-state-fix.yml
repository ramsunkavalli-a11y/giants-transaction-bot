name: Partial post recovery live validation

on:
  push:
    branches:
      - agent/enrichment-formatting-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Validate real rendered post coverage and retry behavior
        run: |
          python - <<'PY'
          from datetime import datetime
          import bot_core as infra
          import post_builder

          data = infra.request_json_with_retry(
              "https://statsapi.mlb.com/api/v1/transactions"
              "?teamId=137&startDate=2026-08-11&endDate=2026-08-14"
          )
          txns = data.get("transactions") or []
          posts = post_builder.build_posts(
              txns,
              player_cache={},
              season_mode=True,
              now_la=datetime(2026, 8, 16, 11, 0, 0),
          )
          assert posts, "expected real rendered posts"
          print("POST COUNT", len(posts))

          covered_by_post = []
          for index, post in enumerate(posts):
              covered = infra.transaction_ids_represented_in_post(post, txns)
              print("\nPOST", index, "COVERS", sorted(covered), "\n", post)
              assert covered, (index, post)
              covered_by_post.append(covered)

          # Simulate post 1 being accepted, then a later post failing. On retry,
          # IDs represented in the accepted post are filtered out before rebuild.
          first_text = posts[0]
          first_ids = covered_by_post[0]
          remaining = [tx for tx in txns if infra.txn_id(tx) not in first_ids]
          retry_posts = post_builder.build_posts(
              remaining,
              player_cache={},
              season_mode=True,
              now_la=datetime(2026, 8, 16, 11, 0, 0),
          )
          assert first_text not in retry_posts, (first_text, retry_posts)
          for tx in txns:
              if infra.txn_id(tx) in first_ids:
                  desc = infra.txn_desc(tx)
                  day = infra.txn_date(tx)
                  assert not any(day in post and desc in post for post in retry_posts)

          print("\nLIVE PARTIAL-POST RECOVERY PASSED")
          PY
