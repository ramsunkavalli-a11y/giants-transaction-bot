name: Partial post state persistence

on:
  push:
    branches:
      - agent/enrichment-formatting-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply partial post state persistence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Apply state persistence fix
        run: |
          python - <<'PY'
          from pathlib import Path

          core_path = Path('bot_core.py')
          core = core_path.read_text()
          marker = '\n\ndef player_url(player_id: int) -> str:\n'
          helper = '\n\ndef transaction_ids_represented_in_post(text: str, txns) -> set[int]:\n    """Return transaction IDs visibly represented by one rendered post.\n\n    Matching requires both the transaction date and description. The short\n    prefix fallback covers the rare grouped line trimmed to the 300-char post\n    limit without confusing same-description moves from different dates.\n    """\n    hay = str(text or "")\n    represented = set()\n    for tx in txns or []:\n        txid = txn_id(tx)\n        if txid <= 0:\n            continue\n        date_text = txn_date(tx)\n        description = txn_desc(tx).strip()\n        if not date_text or date_text not in hay or not description:\n            continue\n        if description in hay:\n            represented.add(txid)\n            continue\n        if len(description) >= 80 and description[:80] in hay:\n            represented.add(txid)\n    return represented\n'
          if marker not in core:
              raise SystemExit('player_url insertion point not found')
          core = core.replace(marker, helper + marker, 1)
          core_path.write_text(core)

          bot_path = Path('bot.py')
          bot = bot_path.read_text()
          insert_marker = '\n\ndef main():\n'
          helper = '\n\ndef record_successful_post(text, new_txns, seen_ids):\n    """Persist represented transaction IDs immediately after Bluesky accepts a post."""\n    covered = infra.transaction_ids_represented_in_post(text, new_txns)\n    if not covered:\n        print("WARNING: posted text could not be mapped to transaction IDs")\n        return set()\n    seen_ids.update(covered)\n    infra.save_seen_ids(seen_ids)\n    print("Persisted posted transaction IDs:", sorted(covered))\n    return covered\n'
          if insert_marker not in bot:
              raise SystemExit('main insertion point not found')
          bot = bot.replace(insert_marker, helper + insert_marker, 1)

          old = '        print("Posted:\\n", text, "\\n---")\n        print("CreateRecord uri:", uri, "cid:", cid)\n\n        status, body_snip = infra.bsky_verify_record(access_jwt, did, uri)\n'
          new = '        print("Posted:\\n", text, "\\n---")\n        print("CreateRecord uri:", uri, "cid:", cid)\n\n        # CreateRecord returned successfully, so persist transaction progress\n        # before verification/sleep/a later post can fail. The workflow commits\n        # this state even when a later bot step exits non-zero.\n        record_successful_post(text, new_txns, seen_ids)\n\n        status, body_snip = infra.bsky_verify_record(access_jwt, did, uri)\n'
          if old not in bot:
              raise SystemExit('post success insertion point not found')
          bot = bot.replace(old, new, 1)
          bot_path.write_text(bot)

          test_path = Path('tests/test_partial_state.py')
          test_path.write_text(
              'import unittest\n'
              'from pathlib import Path\n'
              'from unittest.mock import patch\n\n'
              'import bot\n'
              'import bot_core as infra\n\n\n'
              'class PartialPostStateTests(unittest.TestCase):\n'
              '    def _tx(self, txid, day, desc):\n'
              '        return {"id": txid, "date": day, "description": desc}\n\n'
              '    def test_post_maps_only_same_date_descriptions(self):\n'
              '        same = "San Francisco Giants sent RHP Test Player on a rehab assignment to Sacramento River Cats."\n'
              '        txns = [self._tx(1, "2026-04-14", same), self._tx(2, "2026-04-14", same), self._tx(3, "2026-05-01", same)]\n'
              '        post = "2026-04-14\\n- " + same\n'
              '        self.assertEqual(infra.transaction_ids_represented_in_post(post, txns), {1, 2})\n\n'
              '    def test_grouped_post_maps_multiple_transactions(self):\n'
              '        first = self._tx(10, "2026-08-14", "San Francisco Giants activated C First Player.")\n'
              '        second = self._tx(11, "2026-08-14", "San Francisco Giants activated C Second Player.")\n'
              '        post = "2026-08-14\\n- San Francisco Giants activated C First Player.\\n- San Francisco Giants activated C Second Player."\n'
              '        self.assertEqual(infra.transaction_ids_represented_in_post(post, [first, second]), {10, 11})\n\n'
              '    def test_long_trimmed_description_uses_prefix_fallback(self):\n'
              '        desc = "San Francisco Giants acquired " + ("Very Long Player Description " * 8)\n'
              '        tx = self._tx(20, "2026-08-14", desc)\n'
              '        post = "2026-08-14\\n- " + desc[:100] + "…"\n'
              '        self.assertEqual(infra.transaction_ids_represented_in_post(post, [tx]), {20})\n\n'
              '    def test_successful_post_saves_seen_ids_immediately(self):\n'
              '        tx = self._tx(30, "2026-08-14", "San Francisco Giants activated C Test Player.")\n'
              '        seen = {5}\n'
              '        with patch.object(bot.infra, "save_seen_ids") as save:\n'
              '            covered = bot.record_successful_post("2026-08-14\\n- San Francisco Giants activated C Test Player.", [tx], seen)\n'
              '        self.assertEqual(covered, {30})\n'
              '        self.assertEqual(seen, {5, 30})\n'
              '        save.assert_called_once_with({5, 30})\n\n'
              '    def test_production_workflow_commits_state_even_after_failure(self):\n'
              '        workflow = Path(".github/workflows/run.yml").read_text()\n'
              '        self.assertIn("- name: Commit bot state (last_id.txt + seen_ids.txt)\\n        if: always()", workflow)\n\n\n'
              'if __name__ == "__main__":\n'
              '    unittest.main()\n'
          )
          PY
      - name: Test and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot_core.py bot.py tests/test_partial_state.py
          git diff --cached --check
          python -m py_compile bot_core.py bot.py tests/test_partial_state.py
          python -m unittest tests.test_partial_state -v
          git commit -m "Persist state after each successful post"
          git push origin HEAD:agent/enrichment-formatting-v1
