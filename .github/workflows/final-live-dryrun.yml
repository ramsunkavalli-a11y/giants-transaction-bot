name: Final live dry run

on:
  push:
    branches:
      - agent/enrichment-formatting-v1

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Validate real August transactions without Bluesky
        run: |
          python - <<'PY'
          from datetime import datetime
          import bot_core as infra
          import post_builder

          data = infra.request_json_with_retry(
              "https://statsapi.mlb.com/api/v1/transactions"
              "?teamId=137&startDate=2026-08-01&endDate=2026-08-14"
          )
          txns = data.get("transactions") or []

          def find(piece, day):
              matches = [
                  tx for tx in txns
                  if piece.lower() in infra.txn_desc(tx).lower()
                  and infra.txn_date(tx) == day
              ]
              assert matches, (piece, day)
              return sorted(matches, key=infra.txn_id)[0]

          def render(piece, day):
              posts = post_builder.build_posts(
                  [find(piece, day)], player_cache={}, season_mode=True,
                  now_la=datetime(2026, 8, 16, 10, 0, 0),
              )
              assert len(posts) == 1, posts
              assert len(posts[0]) <= infra.MAX_POST_LEN, posts[0]
              print("\n" + posts[0])
              return posts[0]

          activation = render("activated CF Jonah Cox", "2026-08-04")
          assert "2026 AAA:" not in activation and "Age " not in activation

          furman_selected = render("selected the contract of 2B Nate Furman", "2026-08-01")
          assert "2026 AAA: 434 PA, .284/.370/.405, 7 HR, 12% K, 11% BB" in furman_selected

          harris_selected = render("selected the contract of RHP Trent Harris", "2026-08-07")
          assert "2026 AAA: 40.1 IP, 37 H, 3.12 ERA, 52 K, 18 BB" in harris_selected

          mccray = render("optioned CF Grant McCray", "2026-08-14")
          assert "MLB since Jul 10: 47 PA, .081/.227/.162, 1 HR, 28% K, 15% BB" in mccray

          furman = render("optioned 2B Nate Furman", "2026-08-14")
          assert "MLB since Aug 1: 8 PA, .000/.250/.000, 0 HR, 12% K, 25% BB" in furman

          morgan = render("optioned C Zach Morgan", "2026-08-11")
          assert "MLB since Aug 10: did not appear" in morgan

          cox = render("recalled CF Jonah Cox", "2026-08-14")
          assert "AAA since Aug 4: 34 PA, .533/.588/.767, 1 HR, 12% K, 12% BB" in cox

          leonard = render("designated SS Eddys Leonard for assignment", "2026-08-11")
          assert "2026 MLB: 8 PA, .250/.250/.375, 0 HR, 25% K, 0% BB" in leonard

          knizner = render("signed free agent C Andrew Knizner", "2026-08-11")
          assert "2026 AAA: 234 PA, .294/.393/.552, 12 HR, 17% K, 12% BB" in knizner
          assert "MLB: 4 PA" not in knizner

          print("\nFINAL LIVE DRY RUN PASSED")
          PY
