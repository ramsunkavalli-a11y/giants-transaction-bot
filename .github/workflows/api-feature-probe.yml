name: Temporary API feature probe

on:
  push:
    branches:
      - agent/enrichment-formatting-v1

permissions:
  contents: read

jobs:
  probe:
    if: github.event.head_commit.message == 'Probe transaction enrichment API fields'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Probe MLB API fields
        run: |
          python - <<'PY'
          import requests, json
          B='https://statsapi.mlb.com/api/v1'
          cases=[
            ('MCCRAY_PERSON', f'{B}/people/687529?hydrate=currentTeam,draft,education,transactions'),
            ('MCCRAY_ZIPS_ROS', f'{B}/people/687529/stats?stats=projected_ZipsRos&group=hitting&season=2026'),
            ('MCCRAY_OAA', f'{B}/people/687529/stats?stats=outsAboveAverage&group=fielding&season=2026'),
            ('MCCRAY_METRICS', f'{B}/people/687529/stats?stats=metricAverages&group=hitting&metrics=launchSpeed,launchAngle&season=2026'),
            ('HARRIS_ZIPS_ROS', f'{B}/people/669373/stats?stats=projected_ZipsRos&group=pitching&season=2026'),
            ('HARRIS_ARSENAL', f'{B}/people/669373/stats?stats=pitchArsenal&group=pitching&season=2026'),
          ]
          for label,url in cases:
            r=requests.get(url,timeout=30); print('\n===',label,r.status_code,'===')
            data=r.json()
            if label.endswith('PERSON'):
              p=(data.get('people') or [{}])[0]
              keys=sorted(p.keys())
              print('PERSON_KEYS',keys)
              for k in ['id','fullName','mlbDebutDate','currentTeam','draftYear','primaryPosition','birthDate','active']:
                print(k, json.dumps(p.get(k),default=str))
              print('OPTION_SERVICE_KEYS',[k for k in keys if 'option' in k.lower() or 'service' in k.lower()])
              print('DRAFTS',json.dumps(p.get('drafts'),default=str)[:3000])
              print('EDUCATION',json.dumps(p.get('education'),default=str)[:2000])
            else:
              stats=data.get('stats') or []
              print(json.dumps(stats,default=str)[:8000])
          PY
