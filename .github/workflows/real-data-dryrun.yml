name: Real MLB data dry run

on:
  push:
    branches:
      - agent/enrichment-formatting-v1

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Probe sportId on player stats
        run: |
          python - <<'PY'
          from urllib.parse import urlencode
          import bot_core as core

          def query(label, pid, **params):
              u = f"https://statsapi.mlb.com/api/v1/people/{pid}/stats?" + urlencode(params)
              data = core.request_json_with_retry(u)
              print("\n" + "="*80)
              print(label, params)
              for block in data.get("stats") or []:
                  print("type/group", block.get("type"), block.get("group"), "splits", len(block.get("splits") or []))
                  for split in block.get("splits") or []:
                      st = split.get("stat") or {}
                      print({
                          "season": split.get("season"), "sport": split.get("sport"), "team": split.get("team"),
                          "PA": st.get("plateAppearances"), "AVG": st.get("avg"), "OBP": st.get("obp"),
                          "SLG": st.get("slg"), "HR": st.get("homeRuns"), "IP": st.get("inningsPitched"),
                          "H": st.get("hits"), "ERA": st.get("era"), "K": st.get("strikeOuts"),
                          "BB": st.get("baseOnBalls"),
                      })

          query("McCray MLB date range", 687529, stats="byDateRange", group="hitting", sportId=1,
                season=2026, startDate="2026-07-10", endDate="2026-08-14")
          query("Cox AAA date range", 813841, stats="byDateRange", group="hitting", sportId=11,
                season=2026, startDate="2026-08-04", endDate="2026-08-14")
          query("Furman MLB date range", 801501, stats="byDateRange", group="hitting", sportId=1,
                season=2026, startDate="2026-08-01", endDate="2026-08-14")
          query("Knizner AAA season", 668800, stats="season", group="hitting", sportId=11, season=2026)
          query("Knizner MLB season", 668800, stats="season", group="hitting", sportId=1, season=2026)
          query("Harris AAA season", 805345, stats="season", group="pitching", sportId=11, season=2026)
          query("Hill AAA season", 806367, stats="season", group="hitting", sportId=11, season=2026)
          PY
