name: Real MLB data dry run

on:
  push:
    branches:
      - agent/enrichment-formatting-v1

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile bot.py bot_core.py
      - name: Render and validate real August transactions
        run: |
          python - <<'PY'
          from datetime import datetime
          import bot
          import bot_core as core

          data = core.request_json_with_retry(
              "https://statsapi.mlb.com/api/v1/transactions"
              "?teamId=137&startDate=2026-08-01&endDate=2026-08-14"
          )
          txns = data.get("transactions") or []

          def find(desc_piece, date=None):
              matches = [
                  t for t in txns
                  if desc_piece.lower() in core.txn_desc(t).lower()
                  and (date is None or core.txn_date(t) == date)
              ]
              assert matches, f"No transaction matching {desc_piece!r} {date or ''}"
              return sorted(matches, key=core.txn_id)[0]

          def render(t):
              posts = core.build_posts(
                  [t], player_cache={}, season_mode=True,
                  now_la=datetime(2026, 8, 16, 10, 0, 0),
              )
              assert posts, f"No post for {core.txn_id(t)}"
              assert len(posts) == 1, (core.txn_id(t), posts)
              post = posts[0]
              assert len(post) <= core.MAX_POST_LEN, (len(post), post)
              print("\n" + "=" * 78)
              print("TX", core.txn_id(t), core.txn_date(t), core.txn_typecode(t), core.txn_desc(t))
              print("POST:\n" + post)
              print("LENGTH:", len(post))
              return post

          # Generic SC/status-change transactions must not masquerade as signings.
          cox_activation = render(find("activated CF Jonah Cox", "2026-08-04"))
          assert "Age " not in cox_activation
          assert "drafted by" not in cox_activation
          assert "2026 AAA:" not in cox_activation

          # Contract selections are SE/Selected and should get MiLB context.
          furman_selected = render(find("selected the contract of 2B Nate Furman", "2026-08-01"))
          assert "2026 AAA:" in furman_selected, furman_selected
          assert "https://www.mlb.com/player/801501" in furman_selected

          harris_selected = render(find("selected the contract of RHP Trent Harris", "2026-08-07"))
          assert "2026 AAA:" in harris_selected, harris_selected
          assert " IP" in harris_selected and " H," in harris_selected and " ERA" in harris_selected

          morgan_selected = render(find("selected the contract of C Zach Morgan", "2026-08-10"))
          assert "2026 AAA:" in morgan_selected, morgan_selected

          hill_selected = render(find("selected the contract of CF Turner Hill", "2026-08-13"))
          assert "2026 AAA:" in hill_selected, hill_selected
          assert ".353/.420/.529" in hill_selected, hill_selected

          leonard_selected = render(find("selected the contract of SS Eddys Leonard", "2026-08-04"))
          assert "2026 AAA:" in leonard_selected, leonard_selected

          # Optioned: exact MLB stint since latest recall/selection.
          mccray_option = render(find("optioned CF Grant McCray", "2026-08-14"))
          assert "MLB since Jul 10:" in mccray_option, mccray_option
          assert "47 PA, .081/.227/.162, 1 HR, 28% K, 15% BB" in mccray_option, mccray_option

          furman_option = render(find("optioned 2B Nate Furman", "2026-08-14"))
          assert "MLB since Aug 1:" in furman_option, furman_option
          assert "8 PA, .000/.250/.000, 0 HR, 12% K, 25% BB" in furman_option, furman_option

          morgan_option = render(find("optioned C Zach Morgan", "2026-08-11"))
          assert "MLB since Aug 10: did not appear" in morgan_option, morgan_option

          # Recalled: MiLB stint since most recent option.
          cox_recall = render(find("recalled CF Jonah Cox", "2026-08-14"))
          assert "AAA since Aug 4:" in cox_recall, cox_recall
          assert "34 PA, .533/.588/.767, 1 HR, 12% K, 12% BB" in cox_recall, cox_recall

          # DFA uses current-season MLB performance.
          leonard_dfa = render(find("designated SS Eddys Leonard for assignment", "2026-08-11"))
          assert "2026 MLB:" in leonard_dfa, leonard_dfa

          # Signing: current-year MiLB is primary when MLB sample is tiny.
          knizner = render(find("signed free agent C Andrew Knizner", "2026-08-11"))
          assert "2026 AAA: 234 PA, .294/.393/.552, 12 HR, 17% K, 12% BB" in knizner, knizner
          assert "MLB: 4 PA" in knizner, knizner
          assert "drafted by" not in knizner and "went to" not in knizner, knizner

          print("\nALL REAL-DATA ENRICHMENT CHECKS PASSED")
          PY
