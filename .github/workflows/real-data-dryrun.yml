name: Real MLB data dry run

on:
  push:
    branches:
      - agent/enrichment-formatting-v1

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Probe dedicated MLB stats endpoint
        run: |
          python - <<'PY'
          from urllib.parse import urlencode
          import bot_core as core

          def stats_url(**params):
              return "https://statsapi.mlb.com/api/v1/stats?" + urlencode(params)

          def summarize(label, **params):
              print("\n" + "=" * 80)
              print(label)
              print(params)
              data = core.request_json_with_retry(stats_url(**params))
              blocks = data.get("stats") or []
              print("blocks:", len(blocks))
              for block in blocks:
                  print(" block type/group:", block.get("type"), block.get("group"), "splits", len(block.get("splits") or []))
                  for split in (block.get("splits") or [])[:10]:
                      st = split.get("stat") or {}
                      print({
                          "season": split.get("season"),
                          "sport": split.get("sport"),
                          "league": split.get("league"),
                          "team": split.get("team"),
                          "date": split.get("date"),
                          "PA": st.get("plateAppearances"),
                          "AVG": st.get("avg"),
                          "OBP": st.get("obp"),
                          "SLG": st.get("slg"),
                          "HR": st.get("homeRuns"),
                          "IP": st.get("inningsPitched"),
                          "H": st.get("hits"),
                          "ERA": st.get("era"),
                          "K": st.get("strikeOuts"),
                          "BB": st.get("baseOnBalls"),
                      })
              return data

          sports = core.request_json_with_retry("https://statsapi.mlb.com/api/v1/sports")
          print("SPORT IDS")
          for s in sports.get("sports") or []:
              if any(x in (s.get("name") or "").lower() for x in ("major", "triple", "double", "high", "single", "rookie")):
                  print(s.get("id"), s.get("name"), s.get("abbreviation"))

          summarize(
              "Grant McCray MLB since Jul 10",
              stats="byDateRange", group="hitting", personId=687529,
              sportIds=1, season=2026, startDate="2026-07-10", endDate="2026-08-14",
          )
          summarize(
              "Jonah Cox AAA since Aug 4",
              stats="byDateRange", group="hitting", personId=813841,
              sportIds=11, season=2026, startDate="2026-08-04", endDate="2026-08-14",
          )
          summarize(
              "Andrew Knizner 2026 AAA",
              stats="season", group="hitting", personId=668800,
              sportIds=11, season=2026,
          )
          summarize(
              "Trent Harris 2026 AAA",
              stats="season", group="pitching", personId=805345,
              sportIds=11, season=2026,
          )
          summarize(
              "Turner Hill 2026 AAA",
              stats="season", group="hitting", personId=806367,
              sportIds=11, season=2026,
          )
          PY
