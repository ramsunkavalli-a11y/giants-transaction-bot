name: Temporary 40-man rerank

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rerank:
    if: github.event.head_commit.message == 'Run Atlanta roster diff audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Audit Atlanta roster membership diffs
        run: |
          python - <<'PY' > analysis-atl-roster-diffs.txt
          from datetime import date,timedelta
          import bot_core as infra

          tid=144
          ranges=[(date(2026,4,9),date(2026,4,25)),(date(2026,6,9),date(2026,6,17)),(date(2026,7,5),date(2026,7,11)),(date(2026,7,17),date(2026,7,23)),(date(2026,7,30),date(2026,8,5))]
          def roster(d):
              u=f'https://statsapi.mlb.com/api/v1/teams/{tid}/roster/40Man?date={d}'
              data=infra.request_json_with_retry(u)
              m={}
              for it in data.get('roster') or []:
                  p=it.get('person') or {}; s=it.get('status') or {}
                  if (s.get('code') or '').upper()=='D60': continue
                  pid=infra._safe_int(p.get('id'))
                  if pid: m[pid]=p.get('fullName')
              return m
          txdata=infra.request_json_with_retry('https://statsapi.mlb.com/api/v1/transactions?teamId=144&startDate=2026-03-25&endDate=2026-08-16')
          by={}
          for tx in txdata.get('transactions') or []:
              ds=str(tx.get('date') or tx.get('effectiveDate') or tx.get('transactionDate') or '')[:10]
              by.setdefault(ds,[]).append(tx)
          for start,end in ranges:
              print('\nRANGE',start,end)
              prev=None; d=start
              while d<=end:
                  cur=roster(d)
                  print('\nDATE',d,'COUNT',len(cur))
                  if prev is not None:
                      added=[cur[x] for x in cur.keys()-prev.keys()]
                      removed=[prev[x] for x in prev.keys()-cur.keys()]
                      print(' ADDED',added)
                      print(' REMOVED',removed)
                  for tx in by.get(str(d),[]):
                      print(' TX',tx.get('typeCode'),tx.get('description'))
                  prev=cur; d+=timedelta(days=1)
          PY
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analysis-atl-roster-diffs.txt
          git commit -m "Temporary Atlanta roster diff result"
          git pull --rebase origin main
          git push origin main
