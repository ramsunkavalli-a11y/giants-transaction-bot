name: Transaction presentation live validation

on:
  push:
    branches:
      - agent/enrichment-formatting-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Validate real claims and number suppression
        run: |
          python - <<'PY'
          from datetime import datetime
          import bot_core as infra
          import post_builder

          data = infra.request_json_with_retry(
              "https://statsapi.mlb.com/api/v1/transactions"
              "?teamId=137&startDate=2026-04-01&endDate=2026-08-16"
          )
          txns = data.get("transactions") or []

          incoming = [
              tx for tx in txns
              if (tx.get("typeCode") or "").upper() == "CLW"
              and infra._safe_int((tx.get("toTeam") or {}).get("id")) == 137
          ]
          assert len(incoming) >= 3, len(incoming)
          rendered = {}
          for tx in incoming:
              pid = infra.extract_tx_player_id(tx)
              posts = post_builder.build_posts(
                  [tx], player_cache={}, season_mode=True,
                  now_la=datetime(2026, 8, 16, 11, 0, 0),
              )
              assert len(posts) == 1, posts
              rendered[pid] = posts[0]
              print("\n" + "=" * 80 + "\n" + posts[0])

          assert "2026 AAA: 30.1 IP, 25 H, 2.67 ERA, 43 K, 16 BB" in rendered[672021]
          assert "MLB: 5.1 IP | Age 26" in rendered[672021]
          assert "2026 AAA: 218 PA, .321/.424/.543, 8 HR, 12% K, 12% BB" in rendered[671083]
          assert "MLB: 19 PA | Age 27" in rendered[671083]
          assert "2026 AAA: 320 PA, .274/.338/.420, 9 HR, 26% K, 8% BB" in rendered[694376]
          assert "MLB: 24 PA | Age 27" in rendered[694376]

          outgoing = next(
              tx for tx in txns
              if (tx.get("typeCode") or "").upper() == "CLW"
              and infra._safe_int((tx.get("fromTeam") or {}).get("id")) == 137
          )
          outgoing_posts = post_builder.build_posts(
              [outgoing], player_cache={}, season_mode=True,
              now_la=datetime(2026, 8, 16, 11, 0, 0),
          )
          assert len(outgoing_posts) == 1
          assert "claimed CF Jared Oliva off waivers from San Francisco Giants" in outgoing_posts[0]
          assert "mlb.com/player" not in outgoing_posts[0].lower()
          print("\nOUTGOING PLAIN\n" + outgoing_posts[0])

          number = next(
              tx for tx in txns
              if (tx.get("typeCode") or "").upper() == "NUM"
          )
          assert post_builder.build_posts(
              [number], player_cache={}, season_mode=True,
              now_la=datetime(2026, 8, 16, 11, 0, 0),
          ) == []
          print("\nNUMBER CHANGE SUPPRESSED:", infra.txn_desc(number))
          print("\nLIVE TRANSACTION PRESENTATION VALIDATION PASSED")
          PY
