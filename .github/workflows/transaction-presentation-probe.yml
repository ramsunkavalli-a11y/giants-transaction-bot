name: Transaction presentation probe

on:
  push:
    branches:
      - agent/enrichment-formatting-v1

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Preview incoming waiver claim enrichment
        run: |
          python - <<'PY'
          from datetime import datetime
          import bot_core as infra
          import mlb_domain as domain
          import post_builder

          data = infra.request_json_with_retry(
              "https://statsapi.mlb.com/api/v1/transactions"
              "?teamId=137&startDate=2026-06-01&endDate=2026-08-16"
          )
          txns = data.get("transactions") or []
          wanted = {672021, 671083, 694376}
          for tx in txns:
              if (tx.get("typeCode") or "").upper() != "CLW":
                  continue
              if infra._safe_int((tx.get("toTeam") or {}).get("id")) != 137:
                  continue
              pid = infra.extract_tx_player_id(tx)
              if pid not in wanted:
                  continue
              tx_date = infra.txn_date_obj(tx)
              cache = {}
              details = domain.fetch_player_details(pid, cache=cache)
              enrichment = post_builder.build_signing_enrichment(details, tx_date, cache=cache)
              post = post_builder.build_signing_post(
                  infra.build_base_tx_text(tx), infra.player_url(pid), enrichment
              )
              print("\n" + "=" * 80 + "\n" + post)
          PY
