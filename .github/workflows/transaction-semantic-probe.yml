name: Transaction semantic probe

on:
  push:
    branches:
      - agent/enrichment-formatting-v1

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Probe remaining transaction codes
        run: |
          python - <<'PY'
          from collections import Counter, defaultdict
          import bot_core as infra

          catalog = infra.request_json_with_retry("https://statsapi.mlb.com/api/v1/transactionTypes")
          catalog_by_code = {
              str(item.get("code") or item.get("typeCode") or "").upper(): item
              for item in catalog
          }
          wanted = {"ACQ", "ASG", "NUM", "SGN", "TR", "DES", "DFA", "CLW", "OUT", "RE", "REL"}
          print("CATALOG")
          for code in sorted(wanted):
              print(code, catalog_by_code.get(code))

          data = infra.request_json_with_retry(
              "https://statsapi.mlb.com/api/v1/transactions"
              "?teamId=137&startDate=2026-01-01&endDate=2026-08-16"
          )
          txns = data.get("transactions") or []
          counts = Counter((tx.get("typeCode") or "").upper() for tx in txns)
          print("\nCOUNTS", dict(sorted(counts.items())))

          examples = defaultdict(list)
          for tx in txns:
              code = (tx.get("typeCode") or "").upper()
              if code in wanted and len(examples[code]) < 12:
                  examples[code].append((tx.get("date"), tx.get("typeDesc"), tx.get("description")))
          print("\nEXAMPLES")
          for code in sorted(examples):
              print("\n--", code)
              for row in examples[code]:
                  print(row)
          PY
