name: Transaction ordering live validation

on:
  push:
    branches:
      - agent/enrichment-formatting-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Replay mixed August 14 transaction batch
        run: |
          python - <<'PY'
          from datetime import datetime
          import bot_core as infra
          import mlb_domain as domain
          import post_builder

          data = infra.request_json_with_retry(
              "https://statsapi.mlb.com/api/v1/transactions"
              "?teamId=137&startDate=2026-08-14&endDate=2026-08-14"
          )
          txns = data.get("transactions") or []
          ordered = sorted(txns, key=infra.txn_id)
          print("RAW ORDER")
          for tx in ordered:
              print(infra.txn_id(tx), tx.get("typeCode"), infra.txn_desc(tx))

          posts = post_builder.build_posts(
              txns,
              player_cache={},
              season_mode=True,
              now_la=datetime(2026, 8, 16, 11, 0, 0),
          )
          joined = "\n---POST---\n".join(posts)
          print("\nRENDERED\n" + joined)

          visible = []
          seen_rehab = set()
          seen_trade_ids = set()
          for tx in ordered:
              if domain.is_number_change_transaction(tx):
                  continue
              if domain.is_generic_org_assignment_transaction(tx):
                  continue
              if domain.is_rehab_assignment_transaction(tx):
                  key = (infra.txn_date(tx), infra.txn_desc(tx).strip().lower())
                  if key in seen_rehab:
                      continue
                  seen_rehab.add(key)
              if domain.is_trade_transaction(tx):
                  tid = infra.txn_id(tx)
                  if tid in seen_trade_ids:
                      continue
                  seen_trade_ids.add(tid)
              visible.append((infra.txn_id(tx), infra.txn_desc(tx)))

          positions = []
          for txid, description in visible:
              pos = joined.find(description)
              assert pos >= 0, (txid, description, joined)
              positions.append((txid, pos, description))
          assert [p for _, p, _ in positions] == sorted(p for _, p, _ in positions), positions
          assert len(posts) >= 2, posts
          assert any("optioned" in post.lower() for post in posts)
          assert any("recalled" in post.lower() for post in posts)
          print("\nVISIBLE ORDER")
          for row in positions:
              print(row)
          print("\nLIVE ORDERING VALIDATION PASSED")
          PY
