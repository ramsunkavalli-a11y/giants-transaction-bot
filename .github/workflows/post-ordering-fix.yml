name: Transaction post ordering fix

on:
  push:
    branches:
      - agent/enrichment-formatting-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply transaction post ordering fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Apply ordering fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('post_builder.py')
          text = path.read_text()

          old = '    separate_posts = []\n    grouped = []\n    seen_rehab_assignments = set()\n\n    for tx in sorted(new_txns, key=infra.txn_id):\n'
          new = '    posts = []\n    grouped_pending = []\n    seen_rehab_assignments = set()\n\n    def flush_grouped():\n        nonlocal grouped_pending\n        if not grouped_pending:\n            return\n        posts.extend(infra.pack_posts(infra.build_date_group_blocks(grouped_pending)))\n        grouped_pending = []\n\n    for tx in sorted(new_txns, key=infra.txn_id):\n'
          if old not in text:
              raise SystemExit('build_posts initialization not found')
          text = text.replace(old, new, 1)

          old = '        ):\n            base_text = infra.build_base_tx_text(tx)\n            person_id = infra.extract_tx_player_id(tx)\n'
          new = '        ):\n            flush_grouped()\n            base_text = infra.build_base_tx_text(tx)\n            person_id = infra.extract_tx_player_id(tx)\n'
          if old not in text:
              raise SystemExit('incoming claim block not found')
          text = text.replace(old, new, 1)

          text = text.replace('                separate_posts.append(base_text)\n', '                posts.append(base_text)\n')
          text = text.replace('            separate_posts.append(\n                build_signing_post(', '            posts.append(\n                build_signing_post(')

          old = '        if category == "signing":\n            base_text = infra.build_base_tx_text(tx)\n'
          new = '        if category == "signing":\n            flush_grouped()\n            base_text = infra.build_base_tx_text(tx)\n'
          if old not in text:
              raise SystemExit('signing block not found')
          text = text.replace(old, new, 1)

          old = '        if category:\n            separate_posts.append(\n                build_special_transaction_post(tx, category, cache, now_la)\n            )\n        else:\n            grouped.append(tx)\n\n    grouped_posts = infra.pack_posts(infra.build_date_group_blocks(grouped))\n    return [\n        post for post in (grouped_posts + separate_posts)\n        if post and post.strip()\n    ]\n'
          new = '        if category:\n            flush_grouped()\n            posts.append(\n                build_special_transaction_post(tx, category, cache, now_la)\n            )\n        else:\n            grouped_pending.append(tx)\n\n    flush_grouped()\n    return [post for post in posts if post and post.strip()]\n'
          if old not in text:
              raise SystemExit('build_posts tail not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          test_path = Path('tests/test_post_ordering.py')
          test_path.write_text(
              'import unittest\n'
              'from datetime import datetime\n'
              'from unittest.mock import patch\n\n'
              'import post_builder\n\n\n'
              'class PostOrderingTests(unittest.TestCase):\n'
              '    def _tx(self, txid, code, description):\n'
              '        return {"id": txid, "date": "2026-08-14", "typeCode": code, "description": description}\n\n'
              '    def test_grouped_move_before_special_stays_before_special(self):\n'
              '        activation = self._tx(10, "SC", "San Francisco Giants activated C Test Player from the 10-day injured list.")\n'
              '        option = self._tx(11, "OPT", "San Francisco Giants optioned C Other Player to Sacramento River Cats.")\n'
              '        with patch.object(post_builder, "build_special_transaction_post", return_value="SPECIAL OPTION"):\n'
              '            posts = post_builder.build_posts([option, activation], season_mode=True, now_la=datetime(2026, 8, 14))\n'
              '        self.assertEqual(len(posts), 2)\n'
              '        self.assertIn("activated C Test Player", posts[0])\n'
              '        self.assertEqual(posts[1], "SPECIAL OPTION")\n\n'
              '    def test_special_before_grouped_move_stays_before_grouped(self):\n'
              '        option = self._tx(10, "OPT", "San Francisco Giants optioned C Other Player to Sacramento River Cats.")\n'
              '        activation = self._tx(11, "SC", "San Francisco Giants activated C Test Player from the 10-day injured list.")\n'
              '        with patch.object(post_builder, "build_special_transaction_post", return_value="SPECIAL OPTION"):\n'
              '            posts = post_builder.build_posts([activation, option], season_mode=True, now_la=datetime(2026, 8, 14))\n'
              '        self.assertEqual(len(posts), 2)\n'
              '        self.assertEqual(posts[0], "SPECIAL OPTION")\n'
              '        self.assertIn("activated C Test Player", posts[1])\n\n'
              '    def test_adjacent_plain_moves_still_pack_together(self):\n'
              '        first = self._tx(10, "SC", "San Francisco Giants activated C First Player.")\n'
              '        second = self._tx(11, "SC", "San Francisco Giants activated C Second Player.")\n'
              '        posts = post_builder.build_posts([second, first], season_mode=True, now_la=datetime(2026, 8, 14))\n'
              '        self.assertEqual(len(posts), 1)\n'
              '        self.assertLess(posts[0].index("First Player"), posts[0].index("Second Player"))\n\n'
              'if __name__ == "__main__":\n'
              '    unittest.main()\n'
          )
          PY
      - name: Test and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add post_builder.py tests/test_post_ordering.py
          git diff --cached --check
          python -m py_compile post_builder.py tests/test_post_ordering.py
          python -m unittest tests.test_post_ordering -v
          git commit -m "Preserve transaction order across post types"
          git push origin HEAD:agent/enrichment-formatting-v1
