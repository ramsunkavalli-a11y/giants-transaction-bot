name: Giants Transaction Bot

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Both production jobs update bot-state, so serialize them together.
  group: giants-state
  cancel-in-progress: false   # don't cancel after posting but before committing state

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Checkout bot state
        uses: actions/checkout@v4
        with:
          ref: bot-state
          path: state
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run bot
        env:
          BSKY_IDENTIFIER: ${{ secrets.BSKY_IDENTIFIER }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          BOT_STATE_DIR: ${{ github.workspace }}/state
        run: |
          python bot.py

      - name: Commit bot state
        if: always()
        working-directory: state
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add last_id.txt seen_ids.txt

          # If nothing changed, stop cleanly
          if git diff --cached --quiet; then
            echo "No state changes to commit"
            exit 0
          fi

          git commit -m "Update transaction bot state"
          git pull --rebase origin bot-state
          git push origin HEAD:bot-state
