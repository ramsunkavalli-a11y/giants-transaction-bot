name: Giants Transaction Bot

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: giants-transaction-bot
  cancel-in-progress: false   # don't cancel after posting but before committing state

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # This step is unnecessary (checkout already gets the ref that triggered the workflow),
      # and hard resets can create confusing states. Remove it.
      # - name: Sync with remote main
      #   run: |
      #     git fetch origin main
      #     git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run bot
        env:
          BSKY_IDENTIFIER: ${{ secrets.BSKY_IDENTIFIER }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          python bot.py

      - name: Commit bot state (last_id.txt + seen_ids.txt)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Make sure we're on main and up to date (prevents push races)
          git checkout main
          git pull --rebase origin main

          git add last_id.txt seen_ids.txt
          git commit -m "Update bot state" || echo "No changes to commit"

          git push origin main
