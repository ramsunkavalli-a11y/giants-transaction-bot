name: Trade consolidation live validation

on:
  push:
    branches:
      - agent/enrichment-formatting-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Validate all real 2026 trade records
        run: |
          python - <<'PY'
          import bot_core as infra
          import post_builder

          data = infra.request_json_with_retry(
              "https://statsapi.mlb.com/api/v1/transactions"
              "?teamId=137&startDate=2026-01-01&endDate=2026-08-16"
          )
          trades = [
              tx for tx in (data.get("transactions") or [])
              if (tx.get("typeCode") or "").upper() == "TR"
          ]
          assert len(trades) == 31, len(trades)
          unique_ids = {infra.txn_id(tx) for tx in trades}
          assert len(unique_ids) == 12, len(unique_ids)

          posts = post_builder.build_posts(
              trades, player_cache={}, season_mode=True
          )
          joined = "\n".join(posts)
          print(joined)
          assert joined.count("- Trade:") == 12, joined.count("- Trade:")

          # Arraez/Kilian -> Gair/Marquez
          desc = "San Francisco Giants traded 2B Luis Arraez and RHP Caleb Kilian to Philadelphia Phillies for RHP Marty Gair and RHP Ramon Marquez."
          assert joined.count(desc) == 1
          assert "Marty Gair https://www.mlb.com/player/700248" in joined
          assert "Ramon Marquez https://www.mlb.com/player/827408" in joined

          # Mayer acquisition
          desc = "Boston Red Sox traded 2B Marcelo Mayer to San Francisco Giants for LHP Erik Miller and CF Carlos Gutierrez."
          assert joined.count(desc) == 1
          assert "Marcelo Mayer https://www.mlb.com/player/691785" in joined

          # Ramos -> Lalane/Kent
          desc = "San Francisco Giants traded LF Heliot Ramos to New York Yankees for LHP Henry Lalane and SS Kaeden Kent."
          assert joined.count(desc) == 1
          assert "Henry Lalane https://www.mlb.com/player/700649" in joined
          assert "Kaeden Kent https://www.mlb.com/player/809763" in joined

          # Cash acquisition still links incoming player.
          desc = "Detroit Tigers traded RHP Dylan Smith to San Francisco Giants for cash."
          assert joined.count(desc) == 1
          assert "Dylan Smith https://www.mlb.com/player/681916" in joined

          print("\nLIVE TRADE CONSOLIDATION PASSED")
          PY
