name: ASG live validation

on:
  push:
    branches:
      - agent/enrichment-formatting-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Validate generic suppression and rehab dedupe
        run: |
          python - <<'PY'
          from datetime import datetime
          import bot_core as infra
          import post_builder

          data = infra.request_json_with_retry(
              "https://statsapi.mlb.com/api/v1/transactions"
              "?teamId=137&startDate=2026-03-01&endDate=2026-04-15"
          )
          txns = data.get("transactions") or []

          generic = next(
              tx for tx in txns
              if (tx.get("typeCode") or "").upper() == "ASG"
              and "Jonah Cox assigned to San Francisco Giants" in (tx.get("description") or "")
          )
          assert post_builder.build_posts(
              [generic], player_cache={}, season_mode=True,
              now_la=datetime(2026, 4, 15, 11, 0, 0),
          ) == []
          print("GENERIC SUPPRESSED:", infra.txn_desc(generic))

          hentges = [
              tx for tx in txns
              if (tx.get("typeCode") or "").upper() == "ASG"
              and tx.get("date") == "2026-04-14"
              and "Sam Hentges" in (tx.get("description") or "")
              and "Sacramento River Cats" in (tx.get("description") or "")
          ]
          assert len(hentges) >= 2, len(hentges)
          posts = post_builder.build_posts(
              hentges, player_cache={}, season_mode=True,
              now_la=datetime(2026, 4, 15, 11, 0, 0),
          )
          joined = "\n".join(posts)
          description = "San Francisco Giants sent LHP Sam Hentges on a rehab assignment to Sacramento River Cats."
          assert joined.count(description) == 1, joined
          print("\nREHAB DEDUPED\n" + joined)
          print("\nLIVE ASG VALIDATION PASSED")
          PY
