name: Temporary roster intelligence validation

on:
  push:
    branches:
      - agent/roster-intelligence-v1

permissions:
  contents: read

jobs:
  validate:
    if: github.event.head_commit.message == 'Validate roster intelligence on live 2026 data'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Replay real transaction and roster examples
        run: |
          python - <<'PY'
          from datetime import date, datetime
          import bot_core as infra
          import post_builder
          import transaction_context
          import roster_intelligence as roster
          import roster_daily

          cache = {}
          today = date(2026, 8, 16)
          start = roster.regular_season_start(137, 2026, cache=cache)
          print('REGULAR_SEASON_START', start)

          base, base_ok = roster.fetch_40man_members(137, None, cache=cache)
          print('CURRENT_BASE_NON_D60', len(base), 'OK', base_ok)
          windows, windows_ok = roster.build_trade_exception_windows(137, start, today, cache=cache)
          print('TRADE_WINDOWS_OK', windows_ok)
          for w in windows:
              if w['start'] >= date(2026, 7, 1):
                  print('RECENT_WINDOW', w)
          current, additions, current_ok = roster_daily.current_adjusted_count(137, today, windows, cache)
          print('CURRENT_ADJUSTED', current, 'OK', current_ok, 'ADDITIONS', additions)
          assert current == 40, (current, additions)
          assert {a.get('person_id') for a in additions} == {700280}, additions

          counts, reconciliations, hist_ok = roster_daily.calculate_open_day_history(137, today, cache=cache)
          print('HISTORY_OK', hist_ok, 'DAYS', len(counts))
          summary = roster_daily.summarize_counts(counts, today)
          print('TODAY_SUMMARY', summary)
          print('AUG_COUNTS')
          for d in sorted(counts):
              if d >= date(2026, 8, 1):
                  print(d, counts[d], reconciliations.get(d))
          assert hist_ok
          assert summary['count'] == 40
          assert summary['open'] is False
          assert counts[date(2026, 8, 9)] < 40, counts[date(2026, 8, 9)]
          assert counts[date(2026, 8, 10)] == 40, counts[date(2026, 8, 10)]

          data = infra.request_json_with_retry(
              'https://statsapi.mlb.com/api/v1/transactions?teamId=137&startDate=2026-08-10&endDate=2026-08-16'
          )
          txs = data.get('transactions') or []
          targets = []
          wanted = [
              ('McCray option', lambda t: t.get('typeCode') == 'OPT' and 'Grant McCray' in (t.get('description') or '')),
              ('Whitcomb claim', lambda t: t.get('typeCode') == 'CLW' and 'Shay Whitcomb' in (t.get('description') or '')),
              ('Chapman D60', lambda t: 'Matt Chapman' in (t.get('description') or '') and '60-day injured list' in (t.get('description') or '')),
              ('Hill selection', lambda t: t.get('typeCode') == 'SE' and 'Turner Hill' in (t.get('description') or '')),
              ('Leonard outright', lambda t: t.get('typeCode') == 'OUT' and 'Eddys Leonard' in (t.get('description') or '')),
          ]
          for label, pred in wanted:
              match = next((t for t in txs if pred(t)), None)
              print('TARGET', label, bool(match), (match or {}).get('id'))
              if match:
                  targets.append(match)

          for tx in targets:
              raw_posts = post_builder.build_posts(
                  [tx], player_cache=cache, season_mode=True,
                  now_la=datetime(2026, 8, 16, 15, 0),
              )
              posts = transaction_context.enrich_posts(
                  raw_posts, [tx], cache=cache,
                  now_la=datetime(2026, 8, 16, 15, 0),
              )
              print('\nTX', tx.get('id'), tx.get('typeCode'), tx.get('description'))
              for p in posts:
                  print('LEN', len(p))
                  print(p)
                  assert len(p) <= 300
                  for impossible in ('41/40', '42/40', '43/40'):
                      assert impossible not in p, p
          PY
