name: API exploration

on:
  push:
    branches:
      - agent/enrichment-formatting-v1

permissions:
  contents: read

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Probe date-bounded xwOBA and usage
        run: |
          python - <<'PY'
          import csv
          import io
          import requests

          player_id = 687529
          start = "2026-07-10"
          end = "2026-08-14"

          # Usage: game appearances from hitting log, starts from fielding log.
          def stats(group, stat_type, **extra):
              params = dict(group=group, sportId=1, season=2026,
                            startDate=start, endDate=end, stats=stat_type, **extra)
              r = requests.get(
                  f"https://statsapi.mlb.com/api/v1/people/{player_id}/stats",
                  params=params, timeout=30,
              )
              r.raise_for_status()
              return r.json()

          hit_log = stats("hitting", "gameLog")
          field_log = stats("fielding", "gameLog")
          hit_splits = (hit_log.get("stats") or [{}])[0].get("splits") or []
          field_splits = (field_log.get("stats") or [{}])[0].get("splits") or []
          games = len({(s.get("game") or {}).get("gamePk") for s in hit_splits if (s.get("game") or {}).get("gamePk")})
          starts = sum(int((s.get("stat") or {}).get("gamesStarted") or 0) for s in field_splits)
          print("USAGE", games, "G", starts, "GS")

          # Does expectedStatistics honor a single gamePk even though it ignores date bounds?
          first_game = (hit_splits[0].get("game") or {}).get("gamePk")
          one_game = stats("hitting", "expectedStatistics", gamePk=first_game)
          print("EXPECTED gamePk", first_game, one_game)

          # Correct player filter is plural: batters_lookup[].
          params = {
              "all": "true",
              "type": "batter",
              "player_type": "batter",
              "hfSea": "2026|",
              "game_date_gt": start,
              "game_date_lt": end,
              "batters_lookup[]": str(player_id),
          }
          r = requests.get(
              "https://baseballsavant.mlb.com/statcast_search/csv",
              params=params, timeout=30,
          )
          r.raise_for_status()
          print("SAVANT URL", r.url)
          print("SAVANT bytes", len(r.content))
          rows = list(csv.DictReader(io.StringIO(r.text.lstrip("\ufeff"))))
          rows = [row for row in rows if str(row.get("batter")) == str(player_id)]
          print("SAVANT player rows", len(rows))

          pa_rows = [row for row in rows if row.get("woba_denom") not in (None, "", "0")]
          print("SAVANT PA rows", len(pa_rows))
          actual_num = sum(float(row.get("woba_value") or 0) for row in pa_rows)
          expected_num = sum(float(row.get("estimated_woba_using_speedangle") or 0) for row in pa_rows)
          denom = sum(float(row.get("woba_denom") or 0) for row in pa_rows)
          print("actual wOBA", round(actual_num / denom, 6) if denom else None)
          print("expected wOBA", round(expected_num / denom, 6) if denom else None)
          print("PA denom", denom)

          # Compare against StatsAPI's date-bounded sabermetrics wOBA.
          saber = stats("hitting", "sabermetrics")
          print("StatsAPI sabermetrics", saber)
          PY
