name: API exploration

on:
  push:
    branches:
      - agent/enrichment-formatting-v1

permissions:
  contents: read

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Probe pitcher date-bounded xwOBA
        run: |
          python - <<'PY'
          import csv
          import io
          import requests

          player_id = 805345
          start = "2026-08-07"
          end = "2026-08-16"

          params = {
              "all": "true",
              "type": "pitcher",
              "player_type": "pitcher",
              "hfSea": "2026|",
              "game_date_gt": start,
              "game_date_lt": end,
              "pitchers_lookup[]": str(player_id),
          }
          r = requests.get(
              "https://baseballsavant.mlb.com/statcast_search/csv",
              params=params, timeout=30,
          )
          r.raise_for_status()
          rows = list(csv.DictReader(io.StringIO(r.text.lstrip("\ufeff"))))
          rows = [row for row in rows if str(row.get("pitcher")) == str(player_id)]
          pa_rows = [row for row in rows if row.get("woba_denom") not in (None, "", "0")]
          actual_num = sum(float(row.get("woba_value") or 0) for row in pa_rows)
          expected_num = sum(float(row.get("estimated_woba_using_speedangle") or 0) for row in pa_rows)
          denom = sum(float(row.get("woba_denom") or 0) for row in pa_rows)
          print("SAVANT bytes", len(r.content), "pitches", len(rows), "BF denom", denom)
          print("actual wOBA allowed", round(actual_num / denom, 6) if denom else None)
          print("xwOBA allowed", round(expected_num / denom, 6) if denom else None)

          stats_params = dict(
              group="pitching", sportId=1, season=2026,
              startDate=start, endDate=end, stats="sabermetrics",
          )
          s = requests.get(
              f"https://statsapi.mlb.com/api/v1/people/{player_id}/stats",
              params=stats_params, timeout=30,
          )
          s.raise_for_status()
          print("StatsAPI sabermetrics", s.json())
          PY
