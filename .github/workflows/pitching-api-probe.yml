name: Pitching API probe

on:
  push:
    branches:
      - agent/enrichment-formatting-v1

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Render real pitcher option transactions without Bluesky
        run: |
          python - <<'PY'
          from datetime import datetime
          import bot_core as infra
          import post_builder

          data = infra.request_json_with_retry(
              "https://statsapi.mlb.com/api/v1/transactions"
              "?teamId=137&startDate=2026-06-01&endDate=2026-08-07"
          )
          txns = data.get("transactions") or []

          def render(piece, day):
              matches = [
                  tx for tx in txns
                  if piece.lower() in infra.txn_desc(tx).lower()
                  and infra.txn_date(tx) == day
              ]
              assert matches, (piece, day)
              posts = post_builder.build_posts(
                  [sorted(matches, key=infra.txn_id)[0]],
                  player_cache={}, season_mode=True,
                  now_la=datetime(2026, 8, 16, 11, 0, 0),
              )
              assert len(posts) == 1, posts
              post = posts[0]
              print("\n" + "=" * 80 + "\n" + post)
              assert len(post) <= infra.MAX_POST_LEN
              return post

          walker = render("optioned RHP Ryan Walker", "2026-07-09")
          assert "MLB since Jun 12: 11 G, 11.0 IP, 9.00 ERA" in walker
          assert "5.44 FIP / 5.13 xFIP | 10 K% | 10 BB%" in walker
          assert "(0 GS)" not in walker

          whisenhunt = render("optioned LHP Carson Whisenhunt", "2026-07-10")
          assert "MLB since Jul 9: 1 G (1 GS), 5.2 IP, 3.18 ERA" in whisenhunt
          assert "FIP" not in whisenhunt and "K%" not in whisenhunt and "BB%" not in whisenhunt

          beck = render("optioned RHP Tristan Beck", "2026-08-07")
          assert "MLB since Aug 3: 2 G, 1.1 IP, 13.50 ERA" in beck
          assert "FIP" not in beck and "K%" not in beck and "BB%" not in beck

          print("\nPITCHER OPTION LIVE DRY RUN PASSED")
          PY
