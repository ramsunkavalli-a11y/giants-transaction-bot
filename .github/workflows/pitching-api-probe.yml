name: Pitching API probe

on:
  push:
    branches:
      - agent/enrichment-formatting-v1

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Probe raw sabermetrics for real option stints
        run: |
          python - <<'PY'
          import json
          from urllib.parse import urlencode
          import bot_core as infra

          cases = [
              (676254, "Ryan Walker", "2026-06-12", "2026-07-09"),
              (687931, "Carson Whisenhunt", "2026-07-09", "2026-07-10"),
              (663941, "Tristan Beck", "2026-08-03", "2026-08-07"),
          ]
          for pid, name, start, end in cases:
              params = urlencode({
                  "stats": "sabermetrics",
                  "group": "pitching",
                  "sportId": 1,
                  "season": 2026,
                  "startDate": start,
                  "endDate": end,
              })
              url = f"https://statsapi.mlb.com/api/v1/people/{pid}/stats?{params}"
              data = infra.request_json_with_retry(url)
              print("\n---", name, start, end)
              for block in data.get("stats") or []:
                  for split in block.get("splits") or []:
                      print("team", (split.get("team") or {}).get("id"), (split.get("team") or {}).get("name"))
                      print(json.dumps(split.get("stat") or {}, sort_keys=True))
          PY
